<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>見積AI - BIG HOUSING</title>
<style>
:root{
  --ink:#1D2420;
  --ink-soft:#4A524C;
  --paper:#F3F1EA;
  --paper-2:#FFFFFF;
  --line:#D8D4C8;
  --line-strong:#BFB9A8;
  --safety:#E0561F;
  --safety-dark:#B0430F;
  --safety-tint:#FCE7DB;
  --ok:#3E6B4F;
  --ok-tint:#E4EFE6;
  --warn:#B0430F;
  --warn-tint:#FCE7DB;
  --blue:#2E5266;
  --blue-tint:#E3EBEF;
  --radius:6px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  --mono: "SF Mono", "Consolas", monospace;
}
*{box-sizing:border-box;}
html,body{overflow-x:hidden;max-width:100vw;}
body{margin:0;font-family:var(--font);background:var(--paper);color:var(--ink);}
.app{min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;}

.topbar{
  background:var(--ink);
  color:#F3F1EA;
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:3px solid var(--safety);
}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{
  width:30px;height:30px;
  border:2px solid var(--safety);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:13px;color:var(--safety);
  transform:rotate(45deg);
}
.brand-mark span{transform:rotate(-45deg);}
.brand-text{font-weight:700;letter-spacing:1.5px;font-size:15px;}
.brand-sub{font-size:11px;color:#B8BDB6;letter-spacing:2px;text-transform:uppercase;}
.topbar-right{font-size:12px;color:#B8BDB6;}

.nav-tabs{display:flex;background:var(--paper-2);border-bottom:1px solid var(--line);padding:0 20px;}
.nav-tab{padding:12px 16px;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;}
.nav-tab.active{color:var(--safety-dark);border-bottom-color:var(--safety);}
.nav-tab:hover{color:var(--ink);}

.view{display:none;flex:1;}
.view.active{display:flex;flex-direction:column;}

/* ===== 案件一覧 ===== */
#view-list{padding:24px 20px 60px;max-width:960px;margin:0 auto;width:100%;}
.list-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;gap:12px;flex-wrap:wrap;}
.list-title{font-size:20px;font-weight:700;letter-spacing:0.5px;}
.list-title small{display:block;font-size:12px;font-weight:400;color:var(--ink-soft);letter-spacing:1px;margin-top:2px;}
.btn{
  border:1.5px solid var(--ink);
  background:var(--paper-2);
  color:var(--ink);
  padding:9px 16px;
  border-radius:var(--radius);
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  font-family:var(--font);
}
.btn:hover{background:var(--ink);color:#fff;}
.btn-primary{
  background:var(--safety);
  border-color:var(--safety);
  color:#fff;
}
.btn-primary:hover{background:var(--safety-dark);border-color:var(--safety-dark);}
.btn-ghost{border-color:var(--line-strong);color:var(--ink-soft);}
.btn-ghost:hover{background:var(--paper);color:var(--ink);}
.btn-sm{padding:5px 10px;font-size:12px;}

.empty{
  border:1.5px dashed var(--line-strong);
  border-radius:var(--radius);
  padding:48px 20px;
  text-align:center;
  color:var(--ink-soft);
}
.empty-title{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:6px;}

.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.proj-card{
  background:var(--paper-2);
  border:1px solid var(--line);
  border-left:4px solid var(--safety);
  border-radius:var(--radius);
  padding:14px 16px;
  cursor:pointer;
}
.proj-card:hover{border-color:var(--line-strong);border-left-color:var(--safety-dark);}
.proj-name{font-weight:700;font-size:14px;margin-bottom:4px;}
.proj-meta{font-size:12px;color:var(--ink-soft);margin-bottom:8px;}
.proj-foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;}
.tag{
  display:inline-block;
  padding:2px 8px;
  border-radius:3px;
  font-size:11px;
  font-weight:600;
}
.tag-個人{background:var(--blue-tint);color:var(--blue);}
.tag-法人{background:var(--ok-tint);color:var(--ok);}
.tag-不動産屋紹介{background:var(--safety-tint);color:var(--safety-dark);}
.proj-amount{font-family:var(--mono);font-weight:700;}

/* ===== モーダル ===== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(29,36,32,0.55);
  display:none;align-items:center;justify-content:center;z-index:50;padding:16px;
  width:100vw;height:100vh;
}
.modal-overlay.active{display:flex;}
.modal{
  background:var(--paper-2);
  border-radius:8px;
  padding:24px;
  width:100%;max-width:420px;
  max-height:88vh;overflow-y:auto;
  box-sizing:border-box;
}
.modal h3{margin:0 0 16px;font-size:16px;letter-spacing:0.5px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
.field input, .field select{
  width:100%;padding:9px 10px;border:1px solid var(--line-strong);
  border-radius:var(--radius);font-size:14px;font-family:var(--font);background:#fff;color:var(--ink);
}
.field input:focus, .field select:focus{outline:none;border-color:var(--safety);}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;}
.radio-group{display:flex;gap:8px;flex-wrap:wrap;}
.radio-opt{
  flex:1 1 calc(33.333% - 6px);min-width:0;
  border:1.5px solid var(--line-strong);border-radius:var(--radius);
  padding:8px 4px;text-align:center;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-soft);
  word-break:keep-all;
}
.radio-opt.sel{border-color:var(--safety);background:var(--safety-tint);color:var(--safety-dark);}

/* ===== 見積AI画面 ===== */
#view-estimate{flex:1;}
.est-header{
  background:var(--paper-2);border-bottom:1px solid var(--line);
  padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.back-link{font-size:13px;color:var(--ink-soft);cursor:pointer;font-weight:600;}
.back-link:hover{color:var(--safety-dark);}
.est-title{font-size:16px;font-weight:700;flex:1;min-width:160px;}
.est-title .client-tag{margin-left:8px;}

.est-body{
  flex:1;display:flex;flex-wrap:wrap;gap:0;
}
.panel-left{flex:1 1 560px;min-width:320px;padding:18px 20px;border-right:1px solid var(--line);}
.panel-right{flex:1 1 340px;min-width:300px;display:flex;flex-direction:column;background:var(--paper-2);}

.section-label{font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--ink-soft);text-transform:uppercase;margin-bottom:8px;}

.table-scroll{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:10px;}
table.est-table{width:100%;min-width:560px;border-collapse:collapse;background:var(--paper-2);border:1px solid var(--line);}
table.est-table th{
  background:var(--ink);color:#F3F1EA;font-size:11px;font-weight:600;
  padding:8px 6px;text-align:left;letter-spacing:0.5px;
}
table.est-table td{
  padding:6px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top;
}
table.est-table input{
  width:100%;border:1px solid transparent;background:transparent;font-size:13px;
  padding:4px;border-radius:3px;font-family:var(--font);color:var(--ink);
}
table.est-table input:hover{border-color:var(--line-strong);}
table.est-table input:focus{outline:none;border-color:var(--safety);background:#fff;}
table.est-table td.num input{text-align:right;font-family:var(--mono);}
.row-del{cursor:pointer;color:var(--ink-soft);font-size:16px;padding:0 4px;}
.row-del:hover{color:var(--warn);}

.add-row-btn{font-size:12px;color:var(--blue);cursor:pointer;font-weight:600;margin-bottom:18px;display:inline-block;}
.add-row-btn:hover{color:var(--safety-dark);}

.totals{
  border:1px solid var(--line);border-top:3px solid var(--ink);
  padding:12px 16px;background:var(--paper-2);margin-bottom:18px;
}
.totals-row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;}
.totals-row.grand{font-size:16px;font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:8px;}
.totals-row .val{font-family:var(--mono);}

.margin-box{
  display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px;
}
.margin-stat{
  flex:1;min-width:120px;background:var(--paper-2);border:1px solid var(--line);
  border-radius:var(--radius);padding:10px 12px;
}
.margin-stat .lbl{font-size:11px;color:var(--ink-soft);margin-bottom:3px;}
.margin-stat .num{font-size:18px;font-weight:700;font-family:var(--mono);}
.margin-stat.warn{border-color:var(--warn);background:var(--warn-tint);}
.margin-stat.warn .num{color:var(--warn);}
.margin-stat.ok .num{color:var(--ok);}

/* チャット */
.chat-header{padding:14px 16px;border-bottom:1px solid var(--line);}
.chat-header .h{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft);}
.chat-log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:220px;}
.msg{max-width:88%;padding:9px 12px;border-radius:8px;font-size:13px;line-height:1.5;}
.msg.user{align-self:flex-end;background:var(--ink);color:#F3F1EA;}
.msg.ai{align-self:flex-start;background:var(--paper);border:1px solid var(--line);}
.msg.system{align-self:center;font-size:11px;color:var(--ink-soft);background:none;}
.chat-input-row{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);}
.chat-input-row input{
  flex:1;padding:9px 10px;border:1px solid var(--line-strong);border-radius:var(--radius);
  font-size:13px;font-family:var(--font);
}
.chat-input-row input:focus{outline:none;border-color:var(--safety);}
.chat-send{background:var(--safety);color:#fff;border:none;border-radius:var(--radius);padding:9px 14px;font-weight:700;cursor:pointer;font-size:13px;}
.chat-send:hover{background:var(--safety-dark);}
.chat-send:disabled{background:var(--line-strong);cursor:default;}
.suggest-row{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 12px;}
.suggest-chip{
  font-size:11px;border:1px solid var(--line-strong);border-radius:14px;padding:4px 10px;
  cursor:pointer;color:var(--ink-soft);
}
.suggest-chip:hover{border-color:var(--safety);color:var(--safety-dark);}

.typing{display:flex;gap:3px;padding:4px 0;}
.typing span{width:5px;height:5px;border-radius:50%;background:var(--ink-soft);animation:blink 1.2s infinite;}
.typing span:nth-child(2){animation-delay:0.2s;}
.typing span:nth-child(3){animation-delay:0.4s;}
@keyframes blink{0%,80%,100%{opacity:0.2;}40%{opacity:1;}}

@media (max-width:760px){
  .panel-left{border-right:none;border-bottom:1px solid var(--line);}
  .est-body{flex-direction:column;}
}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark"><span>B</span></div>
      <div>
        <div class="brand-text">BIG HOUSING</div>
        <div class="brand-sub">見積AI プロトタイプ</div>
      </div>
    </div>
    <div class="topbar-right" id="topbar-clock"></div>
  </div>

  <div class="nav-tabs">
    <div class="nav-tab active" id="nav-tab-projects" onclick="switchNav('projects')">案件一覧</div>
    <div class="nav-tab" id="nav-tab-customers" onclick="switchNav('customers')">顧客一覧</div>
  </div>

  <!-- 案件一覧 -->
  <div id="view-list" class="view active">
    <div class="list-header">
      <div class="list-title">案件一覧<small>案件を選んで見積を作成・編集します</small></div>
      <button class="btn btn-primary" onclick="openNewProjectModal()">＋ 新規案件</button>
    </div>
    <div id="empty-state" class="empty" style="display:none;">
      <div class="empty-title">まだ案件がありません</div>
      <div>「＋ 新規案件」から最初の案件を作成してください。</div>
    </div>
    <div id="project-grid" class="card-grid"></div>
  </div>

  <!-- 顧客一覧 -->
  <div id="view-customers" class="view">
    <div style="padding:24px 20px 60px;max-width:960px;margin:0 auto;width:100%;">
      <div class="list-header">
        <div class="list-title">顧客一覧<small>顧客ごとの案件履歴・累計金額をまとめて確認します</small></div>
      </div>
      <div id="customer-empty" class="empty" style="display:none;">
        <div class="empty-title">まだ顧客データがありません</div>
        <div>案件を1件作成すると、自動でここに顧客が登録されます。</div>
      </div>
      <div id="customer-grid" class="card-grid"></div>
    </div>
  </div>

  <!-- 見積AI画面 -->
  <div id="view-estimate" class="view">
    <div class="est-header">
      <span class="back-link" onclick="goToList()">← 案件一覧</span>
      <div class="est-title" id="est-title-text">案件名<span class="tag client-tag" id="est-client-tag"></span></div>
      <button class="btn btn-ghost btn-sm" onclick="openMetaEdit()">案件情報</button>
      <button class="btn btn-ghost btn-sm" onclick="fixSubtotalRows()">小計を自動修復</button>
      <button class="btn btn-ghost btn-sm" onclick="copyDebugData()">データをコピー（診断用）</button>
      <button class="btn btn-ghost btn-sm" onclick="openCostSheet()">原価表（社内用）</button>
      <button class="btn btn-primary btn-sm" onclick="printEstimate()">見積書を印刷</button>
    </div>
    <div class="est-body">
      <div class="panel-left">
        <div class="section-label">見積内訳</div>
        <div class="table-scroll">
        <table class="est-table" id="est-table">
          <thead>
            <tr>
              <th style="width:34%">項目名</th>
              <th style="width:9%">数量</th>
              <th style="width:8%">単位</th>
              <th style="width:12%">単価</th>
              <th style="width:13%">金額</th>
              <th style="width:18%">備考</th>
              <th style="width:6%"></th>
            </tr>
          </thead>
          <tbody id="est-tbody"></tbody>
        </table>
        </div>
        <div class="add-row-btn" onclick="addRow()">＋ 行を追加</div>

        <div class="totals" id="totals-box"></div>

        <div class="section-label">粗利（税別ベース）</div>
        <div class="margin-box" id="margin-box"></div>
      </div>

      <div class="panel-right">
        <div class="chat-header">
          <div class="h">対話編集 AIアシスタント</div>
        </div>
        <div class="chat-log" id="chat-log"></div>
        <div class="suggest-row" id="suggest-row"></div>
        <div class="chat-input-row">
          <input type="text" id="chat-input" placeholder="例：足場工事を追加して" onkeydown="if(event.key==='Enter')sendChat();">
          <button class="chat-send" id="chat-send-btn" onclick="sendChat()">送信</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 顧客詳細モーダル -->
  <div class="modal-overlay" id="customer-detail-modal">
    <div class="modal" style="max-width:520px;">
      <h3 id="cd-title">顧客詳細</h3>
      <div id="cd-body"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeCustomerDetail()">閉じる</button>
      </div>
    </div>
  </div>

  <!-- 新規案件モーダル -->
  <div class="modal-overlay" id="new-project-modal">
    <div class="modal">
      <h3>新規案件</h3>
      <div class="field">
        <label>工事名</label>
        <input type="text" id="np-name" placeholder="例：福留様邸　家屋解体工事">
      </div>
      <div class="field">
        <label>顧客名</label>
        <input type="text" id="np-customer" placeholder="例：福留 修治">
      </div>
      <div class="field">
        <label>顧客タイプ（粗利率に自動反映されます）</label>
        <div class="radio-group" id="np-clienttype">
          <div class="radio-opt" data-val="個人" onclick="selectClientType(this)">個人（25%）</div>
          <div class="radio-opt" data-val="法人" onclick="selectClientType(this)">法人（20%）</div>
          <div class="radio-opt" data-val="不動産屋紹介" onclick="selectClientType(this)">不動産屋（10%）</div>
        </div>
      </div>
      <div class="field">
        <label>郵便番号</label>
        <div style="display:flex;gap:8px;">
          <input type="text" id="np-zip" placeholder="885-0000" style="flex:1;" onkeydown="if(event.key==='Enter'){event.preventDefault();lookupZip();}">
          <button type="button" class="btn btn-ghost btn-sm" style="white-space:nowrap;" onclick="lookupZip()">住所を検索</button>
        </div>
        <div id="np-zip-status" style="font-size:11px;color:var(--ink-soft);margin-top:4px;"></div>
      </div>
      <div class="field">
        <label>現場住所</label>
        <input type="text" id="np-address" placeholder="例：宮崎県都城市〇〇町">
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeNewProjectModal()">キャンセル</button>
        <button class="btn btn-primary" onclick="createProject()">作成する</button>
      </div>
    </div>
  </div>
  <!-- 案件情報編集モーダル -->
  <div class="modal-overlay" id="meta-edit-modal">
    <div class="modal">
      <h3>案件情報の編集</h3>
      <div class="field"><label>顧客名</label><input type="text" id="me-customer"></div>
      <div class="field"><label>郵便番号</label><input type="text" id="me-zip"></div>
      <div class="field"><label>住所</label><input type="text" id="me-address"></div>
      <div class="field"><label>工期</label><input type="text" id="me-workperiod"></div>
      <div class="field"><label>取引方法</label><input type="text" id="me-payment"></div>
      <div class="field"><label>有効期限</label><input type="text" id="me-valid"></div>
      <div class="field"><label>備考・注意書き（見積書末尾に印字）</label>
        <textarea id="me-notes" rows="4" style="width:100%;padding:9px 10px;border:1px solid var(--line-strong);border-radius:var(--radius);font-family:var(--font);font-size:13px;"></textarea>
      </div>
      <div class="field">
        <label>定型注釈から選んで追加（タップで下の欄に追記されます）</label>
        <div id="notes-picker" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeMetaEdit()">キャンセル</button>
        <button class="btn btn-primary" onclick="saveMetaEdit()">保存</button>
      </div>
    </div>
  </div>

  <!-- 原価表モーダル(社内用) -->
  <div class="modal-overlay" id="cost-sheet-modal">
    <div class="modal" style="max-width:640px;">
      <h3 id="cost-sheet-title">原価計算書（社内用・門外不出）</h3>
      <div id="cost-sheet-body"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeCostSheet()">閉じる</button>
        <button class="btn btn-primary" onclick="printCostSheet()">この原価表を印刷</button>
      </div>
    </div>
  </div>

</div>

<script>

const COMPANY = {
  name: "株式会社ビッグハウジング",
  ceo: "代表取締役　石川桂吾",
  zip: "885-0013",
  address: "宮崎県都城市郡元町3205-14",
  tel: "0986-70-9606",
  fax: "0986-77-9133",

/* ==========================================================================
   本番インフラ連携レイヤー（GAS + Googleスプレッドシート）
   ---------------------------------------------------------------------
   claude.aiのプレビュー内では window.storage / api.anthropic.com への
   自動認証fetchがネイティブに用意されているため、このブロックは何もしない。
   ダウンロードして単体のブラウザで開いたとき（＝本番運用時）だけ、
   下記の GAS_URL に向けて通信するように自動的に切り替わる。

   ▼設定方法（松山さんがやること）
   1. Googleスプレッドシートを1つ新規作成し、そのシートIDを控える
   2. 拡張機能 > Apps Script を開き、同梱の Code.gs の中身を貼り付け
   3. Code.gs 内の SHEET_ID にスプレッドシートIDを入力
   4. プロジェクトの設定 > スクリプトプロパティ に
      ANTHROPIC_API_KEY として自分のAnthropic APIキーを登録
   5. デプロイ > 新しいデプロイ > ウェブアプリ
      - 実行するユーザー：自分
      - アクセスできるユーザー：全員
      でデプロイし、発行されたURL（.../exec）を下のGAS_URLに貼り付ける
   ========================================================================== */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbw_LZoOC8646hbUY5hnPaOcjNsWkmUI0vOgMZ9xJMjivQPTYmlfjSNC4plD2sD03z49/exec';
const IS_STANDALONE = (typeof window.storage === 'undefined');

function jsonp(url){
  return new Promise((resolve, reject) => {
    const cbName = 'jsonp_cb_' + Date.now().toString(36) + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error('JSONP timeout'));
    }, 15000);
    function cleanup(){
      clearTimeout(timeout);
      delete window[cbName];
      script.remove();
    }
    window[cbName] = (data) => { cleanup(); resolve(data); };
    script.onerror = () => { cleanup(); reject(new Error('JSONP failed')); };
    script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName;
    document.body.appendChild(script);
  });
}

async function gasList(prefix){
  if(GAS_URL.startsWith('ここに')) throw new Error('GAS_URL未設定');
  const type = String(prefix).replace(':', '');
  return await jsonp(`${GAS_URL}?action=list&type=${encodeURIComponent(type)}`);
}
async function gasGet(key){
  if(GAS_URL.startsWith('ここに')) throw new Error('GAS_URL未設定');
  const idx = key.indexOf(':');
  const type = key.slice(0, idx), id = key.slice(idx + 1);
  return await jsonp(`${GAS_URL}?action=get&type=${encodeURIComponent(type)}&id=${encodeURIComponent(id)}`);
}
async function gasSet(key, value){
  if(GAS_URL.startsWith('ここに')) throw new Error('GAS_URL未設定');
  const idx = key.indexOf(':');
  const type = key.slice(0, idx), id = key.slice(idx + 1);
  // no-cors + text/plain で送ることでプリフライトを回避（iOS Safari対策・既存アプリと同じ方式）
  await fetch(GAS_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'set', type, id, value })
  });
  return { key, value };
}

if(IS_STANDALONE){
  // claude.aiプレビュー外（＝本番のダウンロード版）ではGASバックエンドに差し替える
  window.storage = { get: gasGet, set: gasSet, list: gasList };
}

// AIチャットもスタンドアロン時はGAS経由（Anthropic APIキーをブラウザに晒さないため）
async function callAIviaGAS(systemPrompt, message){
  if(GAS_URL.startsWith('ここに')) throw new Error('GAS_URL未設定。HTML先頭のGAS_URLを設定してください。');
  const requestId = uid();
  // fire-and-forget：結果は待たずに投げっぱなしにし、ポーリングで結果を拾う
  fetch(GAS_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'chatRequest', requestId, system: systemPrompt, message })
  }).catch(()=>{});
  for(let i = 0; i < 45; i++){
    await new Promise(r => setTimeout(r, 1000));
    try{
      const res = await jsonp(`${GAS_URL}?action=chatPoll&requestId=${encodeURIComponent(requestId)}`);
      if(res && res.status === 'done') return res.result || '';
      if(res && res.status === 'error') throw new Error(res.result || 'AIエラー');
    }catch(e){ /* ポーリング失敗は次のループで再試行 */ }
  }
  throw new Error('AIの応答がタイムアウトしました（45秒）。もう一度お試しください。');
}

function toNum(v){
  if(v === undefined || v === null || v === '') return 0;
  if(typeof v === 'number') return isNaN(v) ? 0 : v;
  const cleaned = String(v).replace(/[,，¥￥\s]/g, '');
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
}

function findOrCreateCustomer(name, type, zip, address){
  if(!name) return null;
  let existing = Object.values(customers).find(c => c.name === name);
  if(existing){
    if(zip) existing.zip = zip;
    if(address) existing.address = address;
    existing.type = type;
    saveCustomer(existing);
    return existing.id;
  }
  const c = {
    id: uid(),
    name, type, zip: zip||'', address: address||'',
    createdAt: Date.now()
  };
  customers[c.id] = c;
  saveCustomer(c);
  return c.id;
}

async function doSaveWithRetry(p, retriesLeft){
  try{
    await window.storage.set('project:' + p.id, JSON.stringify(p));
  }catch(e){
    if(retriesLeft > 0){
      await new Promise(r => setTimeout(r, 800));
      return doSaveWithRetry(p, retriesLeft - 1);
    }
    console.error('保存に失敗しました（自動再試行後も失敗）', e);
  }
}

function calcTotals(p){
  let costTotal = 0, saleTotal = 0;
  (p.items||[]).forEach(it => {
    const type = it.type || 'normal';
    if(type !== 'normal') return; // 小計・見出し行は合計に含めない（二重計上防止）
    const amount = toNum(it.qty) * toNum(it.price);
    saleTotal += amount;
    const ref = COST_MASTER.find(c => c.name === it.name);
    const costUnit = it.cost !== undefined && it.cost !== '' ? toNum(it.cost) : (ref ? ref.cost : toNum(it.price) / (1 + (p.marginRate||0)));
    costTotal += toNum(it.qty) * costUnit;
  });
  const tax = saleTotal * 0.1;
  const grandTotal = saleTotal + tax;
  const grossProfit = saleTotal - costTotal;
  const grossMarginRate = saleTotal > 0 ? (grossProfit / saleTotal) : 0;
  return { costTotal, saleTotal, tax, grandTotal, grossProfit, grossMarginRate };
}

function itemCostUnit(it, marginRate){
  const ref = COST_MASTER.find(c => c.name === it.name);
  if(it.cost !== undefined && it.cost !== '' && it.cost !== null) return toNum(it.cost);
  if(ref) return ref.cost;
  return toNum(it.price) / (1 + (marginRate||0));
}

function subtotalAmountAt(items, idx){
  // 直前の小計・見出し・小項目行より後ろにある通常項目の合計を自動計算する（最も近い区切りまで）
  let sum = 0;
  for(let i = idx - 1; i >= 0; i--){
    const t = items[i].type || 'normal';
    if(t !== 'normal') break;
    sum += toNum(items[i].qty) * toNum(items[i].price);
  }
  return sum;
}

function headingTotalAt(items, headingIdx){
  // ■大項目の合計＝次の■見出しが出るまでの全ての通常項目(normal)の合計（〇小項目・小計をまたいでも合算する）
  let sum = 0;
  for(let i = headingIdx + 1; i < items.length; i++){
    const t = items[i].type || 'normal';
    if(t === 'heading') break;
    if(t === 'normal'){
      sum += toNum(items[i].qty) * toNum(items[i].price);
    }
  }
  return sum;
}

async function sendChat(){
  if(chatBusy) return;
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if(!text) return;
  const p = projects[currentProjectId];
  p.chatHistory = p.chatHistory || [];
  p.chatHistory.push({role:'user', text});
  input.value = '';
  renderChatLog();
  chatBusy = true;
  document.getElementById('chat-send-btn').disabled = true;

  const log = document.getElementById('chat-log');
  const typingEl = document.createElement('div');
  typingEl.className = 'msg ai';
  typingEl.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  log.appendChild(typingEl);
  log.scrollTop = log.scrollHeight;

  try{
    const systemPrompt = `あなたは解体工事会社の見積作成アシスタントです。
現在の見積項目（JSON配列、上から順に表示されます）:
${JSON.stringify(p.items)}

参照可能な原価マスター（項目名・単位・原価/税別）:
${JSON.stringify(COST_MASTER)}

見積の構造は次の4階層です（実際の帳票フォーマットに準拠）：
・type:"heading" … ■大項目（例：仮設工事／解体工事／外構工事／その他）。実際の帳票では、この大項目ごとの合計金額が1ページ目のサマリーに表示されます。
・type:"subheading" … 〇小項目（例：住居部／車庫部／店舗部）。大項目の中をさらに区画ごとに分ける場合に使う。省略可。
・type:"normal"（または省略） … 実際の工事項目。数量・単位・単価を持つ。
・type:"subtotal" … 小計行。直前の小項目・見出し・小計より後ろにある通常項目の合計を自動表示する（あなたが金額を計算する必要はない）。

ルール：
・新しい大項目を作る指示（例："外構工事の大項目を作って"）には type:"heading" の行を追加してください。
・重要：小計行(type:"subtotal")と見出し行(type:"heading"/"subheading")には、絶対に qty・price を自分で計算して入れないでください。空文字("")にしてください。数値を入れると二重計上のバグになります。
・通常項目を追加する際、可能な限り各区画（〇小項目）の最後に type:"subtotal" の小計行を入れる、という実際の帳票の慣習に従ってください（ユーザーから明示的な指示がなくても、区画の工事項目を追加し終えたら小計行を追加するのを忘れないでください）。
・通常項目には type:"normal" を指定するか、type自体を省略してください。
・原価マスターにある項目名を使う場合は、単価は原価×(1+${p.marginRate})で計算して税別価格を設定してください（${p.marginRate*100}%が現在の顧客タイプの標準粗利率です）。原価マスターにない項目は、一般的な解体工事の相場観で妥当な単価を設定してください。
・出力は更新後の見積項目の配列のみを純粋なJSONで返してください。説明文やマークダウンの記法(\`\`\`)は一切含めないでください。
・各要素は {"type":"normal","name":"項目名","qty":"数量","unit":"単位","price":"単価(税別、数値)","note":"備考"} の形式にしてください。`;

    let replyText;
    if(IS_STANDALONE){
      // 本番（ダウンロード版）：GAS経由でAnthropic APIを呼ぶ（APIキーはGAS側のスクリプトプロパティに保持）
      replyText = await callAIviaGAS(systemPrompt, text);
    } else {
      // claude.aiプレビュー内：自動認証済みfetchをそのまま使う
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          system: systemPrompt,
          messages: [{ role: "user", content: text }]
        })
      });
      const data = await response.json();
      replyText = (data.content || []).map(b => b.text || '').join('');
    }
    const cleaned = replyText.replace(/```json|```/g, '').trim();
    let newItems;
    try{
      newItems = JSON.parse(cleaned);
      if(!Array.isArray(newItems)) throw new Error('not array');
    }catch(e){
      p.chatHistory.push({role:'ai', text:'うまく反映できませんでした。もう少し具体的に指示してもらえますか？'});
      renderChatLog();
      chatBusy = false;
      document.getElementById('chat-send-btn').disabled = false;
      return;
    }
    p.items = sanitizeItems(newItems);
    p.chatHistory.push({role:'ai', text:'見積を更新しました。左側の表をご確認ください。'});
    await saveProject(p);
    renderTable();
    renderTotals();
    renderChatLog();
    renderProjectList();
  }catch(e){
    p.chatHistory.push({role:'ai', text:'通信エラーが発生しました。'});
    renderChatLog();
    const log2 = document.getElementById('chat-log');
    const retryBtn = document.createElement('div');
    retryBtn.className = 'suggest-chip';
    retryBtn.style.alignSelf = 'center';
    retryBtn.textContent = '↻ もう一度送信する';
    retryBtn.onclick = () => {
      document.getElementById('chat-input').value = text;
      sendChat();
    };
    log2.appendChild(retryBtn);
  }
  chatBusy = false;
  document.getElementById('chat-send-btn').disabled = false;
}

function stripMarker(name){
  return String(name||'').replace(/^[■〇○]\s*/,'');
}

function sanitizeItems(items){
  // AIがtype情報を付け忘れた場合でも、「小計」という名前の行は自動的に特別扱いする防御ロジック
  return (items||[]).map(it => {
    const name = (it.name||'').trim();
    if(!it.type){
      if(name === '小計' || name.startsWith('小計')){
        return {...it, type:'subtotal', qty:'', price:''};
      }
      if(name.startsWith('■')){
        return {...it, type:'heading', name: stripMarker(name), qty:'', price:''};
      }
      if(name.startsWith('〇') || name.startsWith('○')){
        return {...it, type:'subheading', name: stripMarker(name), qty:'', price:''};
      }
    }
    if(it.type === 'heading' || it.type === 'subheading'){
      // AIが自分で■〇記号を名前に含めてしまった場合も、表示側で二重にならないよう除去する
      return {...it, name: stripMarker(it.name)};
    }
    return it;
  });
}

function printCostSheet(){
  const p = projects[currentProjectId];
  const items = p.items || [];
  const t = calcTotals(p);

  function rows(){
    return items.map((it, idx) => {
      const type = it.type || 'normal';
      if(type === 'heading'){
        return `<tr style="background:#EDEBE3;"><td colspan="11" style="padding:6px 8px;font-weight:700;">■　${escapeHtml(stripMarker(it.name))}</td></tr>`;

        return `<tr><td colspan="11" style="padding:5px 8px 5px 16px;font-weight:700;color:#444;">〇　${escapeHtml(stripMarker(it.name))}</td></tr>`;
      }
      if(type === 'subtotal'){
        const sale = subtotalAmountAt(items, idx);
        let cost = 0, i = idx-1;
        for(; i>=0; i--){
          const tt = items[i].type||'normal';
          if(tt !== 'normal') break;

      <div style="display:flex;gap:4px;">
        <img src="${COMPANY.sealB64}" style="width:52px;height:52px;object-fit:contain;">
        <img src="${COMPANY.hankoB64}" style="width:52px;height:52px;object-fit:contain;">
      </div>
    </div>
  `;
}

function printEstimate(){
  const p = projects[currentProjectId];
  const items = p.items || [];
  const t = calcTotals(p);
  const docNo = 'M' + new Date().toISOString().slice(2,7).replace('-','') + '-' + String(Math.floor(Math.random()*90000)+10000);

  const headings = items.map((it,idx)=>({it,idx})).filter(o => (o.it.type||'normal')==='heading');
  let summaryRows;
  if(headings.length === 0){
    // 大項目(■)が1つも設定されていない場合は、工事名を1行のサマリーとして表示するフォールバック
    const allTotal = items.filter(it=>(it.type||'normal')==='normal').reduce((s,it)=>s+toNum(it.qty)*toNum(it.price),0);
    summaryRows = `<tr><td style="padding:8px 10px;font-size:13px;">■　${escapeHtml(p.name||'工事一式')}</td>
      <td></td><td></td><td></td>
      <td style="padding:8px 10px;text-align:right;font-family:'SF Mono',Consolas,monospace;font-size:13px;">${Math.round(allTotal).toLocaleString()}</td>
      <td></td></tr>`;
  }else{
    summaryRows = headings.map(h => {
      const amt = headingTotalAt(items, h.idx);
      return `<tr><td style="padding:8px 10px;font-size:13px;">■　${escapeHtml(stripMarker(h.it.name))}</td>
        <td></td><td></td><td></td>
        <td style="padding:8px 10px;text-align:right;font-family:'SF Mono',Consolas,monospace;font-size:13px;">${Math.round(amt).toLocaleString()}</td>
        <td></td></tr>`;
    }).join('');
  }

  function detailRows(){
    return items.map((it, idx) => {
      const type = it.type || 'normal';
      if(type === 'heading'){
        const amt = headingTotalAt(items, idx);
        return `<tr style="background:#EDEBE3;"><td colspan="4" style="padding:7px 8px;font-weight:700;">■　${escapeHtml(stripMarker(it.name))}</td>
          <td style="padding:7px 8px;text-align:right;font-weight:700;font-family:monospace;">${Math.round(amt).toLocaleString()}</td><td></td></tr>`;
      }
      if(type === 'subheading'){
        return `<tr><td colspan="6" style="padding:6px 8px 6px 18px;font-weight:700;color:#444;">〇　${escapeHtml(stripMarker(it.name))}</td></tr>`;
      }
      if(type === 'subtotal'){
        const amt = subtotalAmountAt(items, idx);
        return `<tr style="border-top:1px solid #999;"><td colspan="4" style="padding:6px 8px;text-align:right;font-weight:700;">${escapeHtml(it.name||'小計')}</td>
          <td style="padding:6px 8px;text-align:right;font-weight:700;font-family:monospace;">${Math.round(amt).toLocaleString()}</td><td></td></tr>`;
      }
      const amount = toNum(it.qty)*toNum(it.price);
      return `<tr>
        <td style="padding:5px 8px;font-size:12px;">${escapeHtml(it.name||'')}</td>
        <td style="padding:5px 8px;text-align:right;font-size:12px;">${it.qty||''}</td>
        <td style="padding:5px 8px;text-align:center;font-size:12px;">${escapeHtml(it.unit||'')}</td>
        <td style="padding:5px 8px;text-align:right;font-size:12px;">${it.price?Math.round(it.price).toLocaleString():''}</td>
        <td style="padding:5px 8px;text-align:right;font-size:12px;font-family:monospace;">${Math.round(amount).toLocaleString()}</td>
        <td style="padding:5px 8px;font-size:11px;color:#555;">${escapeHtml(it.note||'')}</td>
      </tr>`;
    }).join('');
  }

  const notesHtml = (p.notes||'').split('\n').filter(l=>l.trim()).map(l=>`<div style="font-size:10px;color:#444;margin-top:2px;">・${escapeHtml(l)}</div>`).join('');

  const html = `<html><head><title>見積書 ${escapeHtml(p.name)}</title><meta charset="utf-8"><style>
    @page{ size:A4 portrait; margin:15mm 12mm; }
    body{font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;color:#1D2420;font-size:13px;}
    table{width:100%;border-collapse:collapse;}
    .pagebreak{page-break-before:always;}
    th{background:#1D2420;color:#fff;font-size:11px;padding:6px 8px;text-align:left;}
  </style></head><body>

  ${buildEstimateHeaderHtml(p, '御見積書', docNo)}

  <div style="border:1px solid #ccc;padding:14px;margin-bottom:14px;font-size:12px;line-height:2;">
    拝啓　時下ますますご清栄のこととお喜び申し上げます。<br>
    平素は格別のご高配を賜り、厚く御礼申し上げます。<br><br>
    下記の通り御見積申し上げます。<br>
    <div style="text-align:right;">敬具</div>
  </div>

  <div style="font-weight:700;font-size:14px;margin-bottom:8px;border-bottom:2px solid #1D2420;padding-bottom:4px;">件名：${escapeHtml(p.name)}</div>

  <table style="margin-bottom:14px;">
    <tr>
      <td style="width:50%;border:1px solid #1D2420;background:#1D2420;color:#fff;padding:8px 10px;font-size:11px;">合計金額</td>
      <td style="width:50%;border:1px solid #1D2420;background:#1D2420;color:#fff;padding:8px 10px;font-size:11px;">消費税等</td>
    </tr>
    <tr>
      <td style="border:1px solid #ccc;padding:10px;font-size:20px;font-weight:700;">￥${Math.round(t.grandTotal).toLocaleString()}－</td>
      <td style="border:1px solid #ccc;padding:10px;font-size:16px;">￥${Math.round(t.tax).toLocaleString()}－</td>
    </tr>
  </table>

  <table style="margin-bottom:16px;font-size:12px;">
    <tr><td style="width:110px;border:1px solid #ccc;padding:6px 10px;background:#F3F1EA;">工　期</td><td style="border:1px solid #ccc;padding:6px 10px;" colspan="3">${escapeHtml(p.workPeriod||'')}</td></tr>
    <tr><td style="border:1px solid #ccc;padding:6px 10px;background:#F3F1EA;">工事場所</td><td style="border:1px solid #ccc;padding:6px 10px;" colspan="3">${escapeHtml(p.address||'')}</td></tr>
    <tr><td style="border:1px solid #ccc;padding:6px 10px;background:#F3F1EA;">取引方法</td><td style="border:1px solid #ccc;padding:6px 10px;">${escapeHtml(p.paymentMethod||'')}</td>
        <td style="width:110px;border:1px solid #ccc;padding:6px 10px;background:#F3F1EA;">有効期限</td><td style="border:1px solid #ccc;padding:6px 10px;">${escapeHtml(p.validPeriod||'')}</td></tr>
  </table>

  <table style="border:1px solid #1D2420;">
    <tr><th style="width:52%;">工事内容</th><th>数量</th><th>単位</th><th>単価</th><th>金額</th><th>備考</th></tr>
    ${summaryRows}
    <tr style="border-top:2px solid #1D2420;"><td colspan="4" style="padding:8px 10px;text-align:right;">10%税抜計</td><td style="padding:8px 10px;text-align:right;font-family:monospace;">${Math.round(t.saleTotal).toLocaleString()}</td><td></td></tr>
    <tr><td colspan="4" style="padding:8px 10px;text-align:right;">10%消費税</td><td style="padding:8px 10px;text-align:right;font-family:monospace;">${Math.round(t.tax).toLocaleString()}</td><td></td></tr>
  </table>

  <div class="pagebreak"></div>
  ${buildEstimateHeaderHtml(p, '内訳明細書', docNo)}
  <div style="font-weight:700;font-size:13px;margin-bottom:8px;">件名：${escapeHtml(p.name)}</div>
  <table style="border:1px solid #1D2420;">
    <tr><th style="width:44%;">工事内容</th><th>数量</th><th>単位</th><th>単価</th><th>金額</th><th>備考</th></tr>
    ${detailRows()}
  </table>
  ${notesHtml ? `<div style="margin-top:14px;border-top:1px solid #ccc;padding-top:10px;">${notesHtml}</div>` : ''}

  </body></html>`;

  const w = window.open('', '_blank');
  w.document.write(html);
  w.document.close();
  setTimeout(()=>w.print(), 400);
}

function updateClock(){
  const el = document.getElementById('topbar-clock');
  if(el) el.textContent = new Date().toLocaleString('ja-JP', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}
updateClock();
setInterval(updateClock, 30000);

if(IS_STANDALONE && GAS_URL.startsWith('ここに')){
  const banner = document.createElement('div');
  banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#b91c1c;color:#fff;padding:10px 14px;font-size:13px;text-align:center;';
  banner.textContent = '⚠ GAS_URL未設定です。HTML先頭のGAS_URLに、デプロイしたGASウェブアプリのURLを貼り付けてください（データ保存・AIチャットが動作しません）';
  document.body.prepend(banner);
}
loadProjects();
</script>
</body>
</html>
